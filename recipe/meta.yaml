{% set upstream_name = "flash-attn" %}
{% set version = "2.8.3.post2" %}

package:
  name: flash-attn-split
  version: {{ version }}

source:
  # Use PYPI sdist instead of GitHub because they include a specific vendored CUTLASS
  - url: https://pypi.org/packages/source/{{ upstream_name[0] }}/{{ upstream_name }}/{{ upstream_name | replace('-', '_') }}-{{ version }}.tar.gz
    sha256: d0f9f0b08a986cdeadbffcf5ec8b3a8f514366c68ad1853d3ab061bc83cc340b
  # Overwrite with a simpler build script that doesn't try to vendor pre-compiled binaries
  - path: pyproject.toml
  - path: setup.py

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation
  script_env:
    # MAX_JOBS sets nvcc parallelism; tuned with abs.yaml task_timeout
    - MAX_JOBS=8
    - TORCH_CUDA_ARCH_LIST=8.0;8.6;8.9;9.0;10.0;12.0+PTX
  # pytorch 2.15 has no py3.10 builds on pkgs/main
  skip: true  # [py<311 or cuda_compiler_version == "None" or (not linux64)]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}
    - {{ stdlib('c') }}
    - ninja-base
  host:
    - cuda-version {{ cuda_compiler_version }}
    - cuda-cudart-dev
    - libcublas-dev
    - libcurand-dev
    - libcusolver-dev
    - libcusparse-dev
    - pip
    - pybind11
    # flash_api.cpp uses PYBIND11_MODULE; lock the ABI to match pytorch, which
    # builds against system pybind11 (3.0.4 / abi 11 on pkgs/main).
    - pybind11-abi ==11
    - python
    - pytorch {{ pytorch }}
    - pytorch {{ pytorch }}.*=*cuda*
    - setuptools

outputs:
  - name: flash-attn
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ compiler('cuda') }}
        - {{ stdlib('c') }}
      host:
        - cuda-version {{ cuda_compiler_version }}
        - cuda-cudart-dev
        - python
        - pytorch {{ pytorch }}
        - pytorch {{ pytorch }}.*=*cuda*
      run:
        - __cuda
        - einops
        - python
        - pytorch {{ pytorch }}.*=*cuda*

    files:
      include:
        # Includes flash_attn/cute (CuTe DSL backend) as upstream ships it; unsupported on
        # defaults because its nvidia-cutlass-dsl dependency is not on pkgs/main.
        - 'lib/python*/site-packages/flash_attn/**'
        - 'lib/python*/site-packages/{{ upstream_name | replace('-', '_') }}-{{ version }}.dist-info/**'
        - 'lib/python*/site-packages/flash_attn_2_cuda.cpython-*.so'

    test:
      imports:
        - flash_attn
      commands:
        - pip check
        # Checkpoint loading must reject arbitrary pickles even with torch's legacy
        # torch.load default (explicit weights_only=True, new in 2.8.3.post2).
        - |-
          python -c "
          import os, pathlib, pickle, sys, tempfile, types
          os.environ['TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD'] = '1'
          import torch
          sys.modules['sentencepiece'] = types.SimpleNamespace(SentencePieceProcessor=object)
          sys.modules['transformers'] = types.SimpleNamespace(GPT2Config=object, LlamaConfig=object)
          from flash_attn.models.llama import state_dicts_from_checkpoint
          d = pathlib.Path(tempfile.mkdtemp()) / 'm'
          d.mkdir()
          torch.save({'w': torch.ones(2)}, d / 'consolidated.00.pth')
          assert state_dicts_from_checkpoint(d.parent, 'm')[0]['w'].sum().item() == 2
          Evil = type('Evil', (), {})
          torch.save({'w': Evil()}, d / 'consolidated.00.pth')
          try:
              state_dicts_from_checkpoint(d.parent, 'm')
          except pickle.UnpicklingError:
              print('weights_only=True enforced')
          else:
              sys.exit('checkpoint loader accepted an arbitrary pickled object')
          "
      requires:
        - pip

  - name: flash-attn-fused-dense
    requirements:
      build:
        - {{ compiler('cxx') }} # needed for DSO checker
        - {{ stdlib('c') }}     # needed for DSO checker
        - {{ compiler('cuda') }}
      host:
        - cuda-version {{ cuda_compiler_version }}
        - cuda-cudart-dev
        - libcublas-dev
        - python
        - pytorch {{ pytorch }}
        - pytorch {{ pytorch }}.*=*cuda*
      run:
        - python
        - {{ pin_subpackage('flash-attn', exact=True) }}

    files:
      include:
        - 'lib/python*/site-packages/fused_dense_lib.cpython-*.so'

    test:
      imports:
        - flash_attn.ops.fused_dense
      commands:
        - pip check
      requires:
        - pip

  - name: flash-attn-layer-norm
    requirements:
      build:
        - {{ compiler('cxx') }} # needed for DSO checker
        - {{ stdlib('c') }}     # needed for DSO checker
        - {{ compiler('cuda') }}
      host:
        - cuda-version {{ cuda_compiler_version }}
        - cuda-cudart-dev
        - python
        - pytorch {{ pytorch }}
        - pytorch {{ pytorch }}.*=*cuda*
      run:
        - python
        - {{ pin_subpackage('flash-attn', exact=True) }}

    files:
      include:
        - 'lib/python*/site-packages/dropout_layer_norm.cpython-*.so'

    test:
      imports:
        - flash_attn.ops.layer_norm
      commands:
        - pip check
      requires:
        - pip

about:
  home: https://github.com/Dao-AILab/flash-attention
  summary: 'Flash Attention: Fast and Memory-Efficient Exact Attention'
  description: |
    FlashAttention is a fast and memory-efficient implementation of the exact attention
    mechanism for Transformer models. It supports Ampere, Ada Lovelace, Hopper, and
    Blackwell NVIDIA GPUs with fp16/bf16 precision.
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE
    - LICENSE_CUTLASS.txt
  dev_url: https://github.com/Dao-AILab/flash-attention
  doc_url: https://github.com/Dao-AILab/flash-attention

extra:
  feedstock-name: flash-attn
  recipe-maintainers:
    - carterbox
    - weiji14
