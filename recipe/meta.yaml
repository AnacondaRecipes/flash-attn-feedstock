{% set version = "2.8.3.post2" %}

package:
  name: flash-attn-split
  version: {{ version }}

source:
  # Use PYPI sdist instead of GitHub because they include a specific vendored CUTLASS
  - url: https://pypi.org/packages/source/f/flash-attn/flash_attn-{{ version }}.tar.gz
    sha256: d0f9f0b08a986cdeadbffcf5ec8b3a8f514366c68ad1853d3ab061bc83cc340b
  # Overwrite with a simpler build script that doesn't try to vendor pre-compiled binaries
  - path: pyproject.toml
  - path: setup.py

build:
  number: 0
  script:
    - {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation
    # Non-fatal: slowest compile jobs (seconds) and per-extension job-seconds from each .ninja_log
    - for log in $(find build -name .ninja_log); do echo "== $log"; awk 'NR>1{d=($2-$1)/1000; t+=d; print d, $4} END{print t, "TOTAL_JOB_SECONDS"}' "$log" | sort -rn | head -15; done || true
  script_env:
    # MAX_JOBS sets nvcc parallelism; tuned with abs.yaml task_timeout
    - MAX_JOBS=8
    - TORCH_CUDA_ARCH_LIST=8.0;8.6;8.9;9.0;10.0;12.0+PTX
    # Per-step progress and elapsed time in the ninja output
    - "NINJA_STATUS=[%f/%t %es] "
  # pytorch 2.15 has no py3.10 builds on pkgs/main
  skip: true  # [py<311 or cuda_compiler_version == "None" or (not linux64)]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}
    - {{ stdlib('c') }}
    - ninja-base
  host:
    - cuda-version {{ cuda_compiler_version }}
    - cuda-cudart-dev
    - libcublas-dev
    - libcurand-dev
    - libcusolver-dev
    - libcusparse-dev
    - pip
    - pybind11
    # flash_api.cpp uses PYBIND11_MODULE; lock the ABI to match pytorch's
    # vendored pybind11 (both resolve to 3.0.4 / abi 11 on pkgs/main).
    - pybind11-abi ==11
    - python
    - pytorch {{ pytorch }}
    - pytorch {{ pytorch }}.*=*cuda*
    - setuptools

outputs:
  - name: flash-attn
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ compiler('cuda') }}
        - {{ stdlib('c') }}
      host:
        - cuda-version {{ cuda_compiler_version }}
        - cuda-cudart-dev
        - python
        - pytorch {{ pytorch }}
        - pytorch {{ pytorch }}.*=*cuda*
      run:
        - __cuda
        - einops
        - python
        - pytorch {{ pytorch }}.*=*cuda*

    files:
      include:
        - 'lib/python*/site-packages/flash_attn/**'
        - 'lib/python*/site-packages/flash_attn-{{ version }}.dist-info/**'
        - 'lib/python*/site-packages/flash_attn_2_cuda.cpython-*.so'

    test:
      imports:
        - flash_attn
      commands:
        - pip check
      requires:
        - pip

  - name: flash-attn-fused-dense
    requirements:
      build:
        - {{ compiler('cxx') }} # needed for DSO checker
        - {{ stdlib('c') }}     # needed for DSO checker
        - {{ compiler('cuda') }}
      host:
        - cuda-version {{ cuda_compiler_version }}
        - cuda-cudart-dev
        - libcublas-dev
        - python
        - pytorch {{ pytorch }}
        - pytorch {{ pytorch }}.*=*cuda*
      run:
        - python
        - {{ pin_subpackage('flash-attn', exact=True) }}

    files:
      include:
        - 'lib/python*/site-packages/fused_dense_lib.cpython-*.so'

    test:
      imports:
        - flash_attn.ops.fused_dense
      commands:
        - pip check
      requires:
        - pip

  - name: flash-attn-layer-norm
    requirements:
      build:
        - {{ compiler('cxx') }} # needed for DSO checker
        - {{ stdlib('c') }}     # needed for DSO checker
        - {{ compiler('cuda') }}
      host:
        - cuda-version {{ cuda_compiler_version }}
        - cuda-cudart-dev
        - python
        - pytorch {{ pytorch }}
        - pytorch {{ pytorch }}.*=*cuda*
      run:
        - python
        - {{ pin_subpackage('flash-attn', exact=True) }}

    files:
      include:
        - 'lib/python*/site-packages/dropout_layer_norm.cpython-*.so'

    test:
      imports:
        - flash_attn.ops.layer_norm
      commands:
        - pip check
      requires:
        - pip

about:
  home: https://github.com/Dao-AILab/flash-attention
  summary: 'Flash Attention: Fast and Memory-Efficient Exact Attention'
  description: |
    FlashAttention is a fast and memory-efficient implementation of the exact attention
    mechanism for Transformer models. It supports Ampere, Ada Lovelace, Hopper, and
    Blackwell NVIDIA GPUs with fp16/bf16 precision.
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE
    - LICENSE_CUTLASS.txt
  dev_url: https://github.com/Dao-AILab/flash-attention
  doc_url: https://github.com/Dao-AILab/flash-attention

extra:
  feedstock-name: flash-attn
  recipe-maintainers:
    - carterbox
    - weiji14
